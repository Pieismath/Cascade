name = "cascade-scan"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Create the namespace with:
#   npx wrangler kv namespace create SCAN_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "SCAN_KV"
id = "35ee0915468e4f6c8af3e07a412dc57e"

[vars]
# The iOS app's bundle identifier — the audience of Apple identity tokens.
APPLE_BUNDLE_ID = "jhfang.MyPianoInstructor2"
# Free scan credits per Apple account (a taster; paid packs cover the rest).
FREE_SCANS = "1"
# One credit covers up to this many pages; longer scans cost more credits.
PAGES_PER_CREDIT = "4"
# Hard caps on provider spend per credit (system crops / requests per job).
MAX_IMAGES_PER_CREDIT = "24"
MAX_REQUESTS_PER_CREDIT = "6"
MAX_PAGES_PER_SCAN = "12"
RATE_LIMIT_PER_MINUTE = "20"
# App Store consumable product ids → credits granted. Must match App Store
# Connect and the app's ScanStore.productIDs.
PRODUCTS = '{"jhfang.MyPianoInstructor2.scans10": 10, "jhfang.MyPianoInstructor2.scans25": 25}'
# Session token lifetime in days.
SESSION_DAYS = "60"
# Models (override without redeploying code)
ANTHROPIC_MODEL = "claude-sonnet-5"
# Retry tier for hard scans. Opus keeps worst-case cost inside pack margins;
# Fable is better still but ~2× the price per retry.
ANTHROPIC_MODEL_HIGH = "claude-opus-5"
GEMINI_MODEL = "gemini-2.5-flash"
# Model for the app's "try harder" retry. Left unset it retries on
# GEMINI_MODEL, which is what a free-tier key can reach; on a paid project set
# it to "gemini-2.5-pro" for better retries.
# GEMINI_MODEL_HIGH = "gemini-2.5-pro"
# "anthropic" or "gemini" — which provider answers first when both keys are set.
PRIMARY_PROVIDER = "gemini"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   SESSION_SECRET      — required; generate with: openssl rand -hex 32
#   ANTHROPIC_API_KEY   — best quality (paid)
#   GEMINI_API_KEY      — free-tier friendly (aistudio.google.com)
# At least one provider key is required. With only GEMINI_API_KEY set, the
# worker runs entirely on Gemini — a $0 setup. With both, Anthropic is
# primary and Gemini covers outages.
